name: Update news

on:
  schedule:
    - cron: "15 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch AI news
        run: python3 new-site/news/fetch_news.py docs/news/news.json
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-site/news/news.json docs/news/news.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Update news $(date -u +'%F %H:%M')"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
